<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse; /*une as células*/
        } 
        td{
            border: 1px solid black;
            padding: 4px;
            text-align: center;
            vertical-align: middle;
            /*alinhamento verticalcom top, midle, bottom*/
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
        <!--Hierarquia de tabelas
            Table
                table row = linha de tabela
                    table header = cabeçalho de tabela
                    table data = dado de tabela
        -->
    <table>
        <tr><!--Primeira linha-->
            <td>A1</td><!--dado-->
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
