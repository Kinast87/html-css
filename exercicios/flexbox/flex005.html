<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0
        }
        body{
            background-color: yellow;
        }
        main{
            background-color: aqua;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }
        section{
            background-color: red;
            width: 50vw;
            height: 50vw;
            align-content: center;
            text-align: center;
            border: 2px solid black;
            flex-basis: 33vw;/*determina o tamanho dos itens*/
        }
        #primeiro{
            order: -1;
            align-self: flex-start;
        }
        #segundo{
            order: 0;
            align-self: auto;
        }
        #terceiro{
            align-self: flex-end;
            order: 1;
        }
    </style>
</head>
<body><main>
        <section id="terceiro">
            <h1>terceiro</h1>
        </section>
        <section id="primeiro">
            <h1>primeiro</h1>
        </section>
        <section id="segundo">
            <h1>segundo</h1>
        </section>
    </main>
</body>
</html>
