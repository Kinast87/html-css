    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table{
            width: 600px;
            border-collapse: collapse;
        }
        th{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        td{

        }
        tbody > tr:nth-child(2n){

</head>
