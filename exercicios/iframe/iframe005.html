<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
</head>
<body>
    <a href="#" onclick="clicou()">Clique aqui</a>
    <div id="Saída"></div>

    <script>
        function clicou(){
            s = window.document.getElementById("Saída")
            s.innerHTML += '<p>Você clicou!</p>'
        }
    </script>
</body>
</html>
