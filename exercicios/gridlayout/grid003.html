<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridLayout</title>
    <style>

        .container{
            height: 250px;
            background-color: aqua;
            display: grid;
            gap: 10px;
            /*grid-template substitui grid-template colums e rows, primerio valor para rows e segundo para columns*/
            grid-template: repeat(3, auto)/ repeat(3, 1fr);
        /*FAZ COM QUE CADA LINHA/COLUNA NOVA ACRESCENTADA TENHA 100PX*/
            grid-auto-rows: 100px;
            grid-auto-columns: 100px;
        /*place-items junta o align e o justify-items
        sendo primeiro o align*/
            place-items: strech strech;
        /*place-content junta o align e o justify-content
        sendo primeiro o align*/
            place-content: strech strech;
        /*grid-autoflow determina onde serão implantados os novos elementos*/
            grid-auto-flow: row;
        }
        .item{
            background-color: blue;
            border: 1px solid red;
        } 
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
    </div>
</body>
</html>
