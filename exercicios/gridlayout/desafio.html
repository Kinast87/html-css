<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Gridlayout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            height: 100vh;
            background-color: aqua;
            display: grid;
            grid-template: repeat(10, 10%) / repeat(9, 1fr);

        }
        .topo{
            background-color: blue;
            grid-area: 1 / 1 / 3 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .menu{
            background-color: red;
            grid-area: 3 / 1 / 4 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .principal{
            background-color: yellow;
            grid-area: 4 / 1 / -2 / -3;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .secundario{
            background-color: blueviolet;
            grid-area: 4 / -3 / -2 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .rodape{
            background-color: black;
            grid-area: -2 / 1 / -1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        p{
            color: white;
            font-size: 50px;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="topo"><p>Topo</p></div>
        <div class="menu"><p>Menu</p></div>
        <div class="principal"><p>Principal</p></div>
        <div class="secundario"><p>Secundario</p></div>
        <div class="rodape"><p>Rodape</p></div>
    </div>
</body>
</html>
